[INPUT]
macda_file = /Users/zhaoyoung/Documents/Datasets/mro-mcs-reanalysis_mars_MY34SOY665_MY35SOY027_v2-0.nc

# start_index is the stable anchor of this run: the record whose true MACDA date
# fixes where the 669-sol label calendar starts, and the record XFCST counts from.
# It must not be changed between a full run and a partial rerun, otherwise the
# same NC record would be written under a different filename.
start_index = 0
end_index =
max_times =

[OUTPUT]
output_root = output/MY34-MY35
output_prefix = MACDA
variable_table = db/MACDA-v2_CORE.csv
map_source = MACDA

lat_start = -87.5
lat_end = 87.5
nlat = 36
lon_start = 0.0
lon_end = 355.0
nlon = 72
lon_convention = 0_360

mars_radius_km = 3389.92

plev_pa = 700,610,500,400,300,200,150,100,70,50,30,20,10,5,2,1,0.5,0.2,0.1

# This file crosses the MY34/MY35 boundary. MY34 has 668 sols in the MACDA
# calendar, but metgrid counts a fixed 669-sol year, so label the records on
# MarsWRF's fixed calendar, anchored at the record at start_index above.
# This is a compatibility relabelling for WPS, not a MACDA calendar fix; labels
# after the year boundary are one sol later than the true MACDA date.
# See docs/MACDA跨年固定669兼容方案.md.
hdate_strategy = marswrf_fixed669
emit_optional_fields = true
xfcst_from_start = true

[MARS]
gravity = 3.72
tau_reference_pressure_pa = 700.0
validate_time_alignment = true
time_tolerance_seconds = 1.0
